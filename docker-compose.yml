version: '3.8'

services:
  road-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: road_segmentation_app
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - MODEL_PATH=road_unet_epoch15.pth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
